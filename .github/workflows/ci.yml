name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  compatibility:
    name: macOS 14 compatibility
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify toolchain
        run: |
          swiftc --version
          test "$(xcrun --sdk macosx --show-sdk-version)" = "15.2"

      - name: Build and self-test
        run: |
          ./build.sh
          ./build/Menubench --selftest

      - name: Unit tests
        run: ./build.sh --test

  universal:
    name: Universal Xcode build
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build Apple silicon and Intel app
        run: |
          set -euo pipefail
          xcodebuild \
            -project Menubench.xcodeproj \
            -scheme Menubench \
            -configuration Release \
            -derivedDataPath build/CI \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

          APP="build/CI/Build/Products/Release/Menubench.app"
          test -d "$APP"
          ARCHS_BUILT="$(lipo -archs "$APP/Contents/MacOS/Menubench")"
          [[ "$ARCHS_BUILT" == *arm64* && "$ARCHS_BUILT" == *x86_64* ]]
          "$APP/Contents/MacOS/Menubench" --selftest
